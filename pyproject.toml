[project]
name = "reportboard"
version = "0.1.0"
description = "Local-only kanban-style report board"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "markdown>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
